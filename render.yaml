# Blueprint do Render — API Farol
services:
  - type: web
    name: farol-api
    runtime: node
    plan: free               # no Free, o serviço dorme após cerca de 15 min sem uso; o setInterval de 60 s só roda enquanto estiver acordado
    region: oregon           # troque por 'virginia' se preferir; ideal: mesma região do Supabase
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start -w @farol/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
